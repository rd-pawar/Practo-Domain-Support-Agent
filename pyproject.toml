[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "practo-agent"
version = "1.0.0"
description = "Practo Domain Support Agent – Healthcare Administrative Agentic System"
requires-python = ">=3.9"
dependencies = [
    "crewai>=0.60.0",
    "autogen-agentchat>=0.4.0",
    "autogen-core>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "sentence-transformers>=2.7.0",
    "chromadb>=0.5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "numpy>=1.24.0",
    "nltk>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.27.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
